  reason: >
    answerable_math and answerable_math_cot are out of scope (confirmed 2026-08-23).
    Non-CoT maths may be reinstated later, at which point these move into `pairs`.
  csvs:
    - uncertainty_run_gemma_answerable_math_combined_llm_verdict_dse_output.csv
    - uncertainty_run_llama_answerable_math_combined_llm_verdict_dse_output.csv
    - uncertainty_run_mistral_answerable_math_combined_llm_verdict_dse_output.csv
    - uncertainty_run_qwen_answerable_math_combined_llm_verdict_dse_output.csv
    - uncertainty_run_qwen3_14b_answerable_math_combined_llm_verdict_dse_output.csv
    - uncertainty_run_gemma3_27b_answerable_math_combined_llm_verdict_dse_output.csv
    - uncertainty_run_gemma3_12b_answerable_math_cot_combined_llm_verdict_dse_output.csv
    - uncertainty_run_gemma3_27b_answerable_math_cot_combined_llm_verdict_dse_output.csv
    - uncertainty_run_llama31_8b_answerable_math_cot_combined_llm_verdict_dse_output.csv
    - uncertainty_run_mistral7b_answerable_math_cot_combined_llm_verdict_dse_output.csv
    - uncertainty_run_qwen25_7b_answerable_math_cot_combined_llm_verdict_dse_output.csv
    - uncertainty_run_qwen3_14b_answerable_math_cot_combined_llm_verdict_dse_output.csv
